name: Build Survival AI APK from uploaded source ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Extract source
        run: unzip -q -o survival_ai_cloud_starter.zip -d project

      - name: Verify and assemble app
        run: |
          python3 project/scripts/check_sources.py
          g++ -std=c++17 -Wall -Wextra -Werror -I project/overlay/lib/src/main/cpp project/tests/generation_budget_test.cpp -o /tmp/generation-budget-test
          /tmp/generation-budget-test
          bash project/scripts/assemble.sh

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.13113456' 'cmake;3.31.6'

      - name: Build APK
        working-directory: project/.upstream/llama.cpp/examples/llama.android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: survival-ai-android-debug
          path: project/.upstream/llama.cpp/examples/llama.android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
